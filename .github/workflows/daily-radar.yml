name: Daily contribution radar

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-contribution-radar
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Generate report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run contribution-radar

      # Runs even when generation fails so partial or total scan failures are visible.
      # The report always carries a fresh timestamp, so an unchanged file means it
      # was never rewritten and would only show stale results.
      - name: Publish workflow summary
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- REPORT.md; then
            echo "REPORT.md was not regenerated; check the 'Generate report' log." >> "$GITHUB_STEP_SUMMARY"
          else
            cat REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit changed report as GitHub Actions
        run: |
          if git diff --quiet -- REPORT.md; then
            echo "Report is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPORT.md
          git commit -m "chore: refresh contribution radar"
          git push

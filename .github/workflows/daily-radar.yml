name: Daily contribution radar

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: daily-contribution-radar
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Generate report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run contribution-radar

      # Runs even when generation fails so partial or total scan failures are visible.
      # The report always carries a fresh timestamp, so an unchanged file means it
      # was never rewritten and would only show stale results.
      - name: Publish workflow summary
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- REPORT.md; then
            echo "REPORT.md was not regenerated; check the 'Generate report' log." >> "$GITHUB_STEP_SUMMARY"
          else
            cat REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # main requires passing checks, so the report goes through a pull request.
      # Pull requests opened with GITHUB_TOKEN do not trigger pull_request workflows,
      # so CI is started explicitly on the branch; its results attach to the same commit.
      - name: Open pull request for changed report
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: radar/refresh
        run: |
          if git diff --quiet -- REPORT.md; then
            echo "Report is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add REPORT.md
          git commit -m "chore: refresh contribution radar"
          git push --force origin "$BRANCH"

          gh workflow run ci.yml --ref "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore: refresh contribution radar" \
              --body "Automated daily refresh of REPORT.md. Merges automatically once checks pass."
          fi
          gh pr merge "$BRANCH" --auto --squash

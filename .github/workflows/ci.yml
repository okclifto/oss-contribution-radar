name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR or branch supersedes the run still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the Python checks are needed. Markdown, license and other
  # non-Python changes skip them; anything uncertain runs them.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Python-relevant changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Files the Python checks depend on. Keep broad: a missed file skips CI.
          pattern='^(src/|tests/|config/|uv\.lock$|\.python-version$|\.github/workflows/ci\.yml$)|\.(py|toml|cfg|ini)$'

          decide() {
            echo "code=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
            exit 0
          }

          case "$EVENT" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            workflow_dispatch)
              if [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
                decide true "Manual run on $DEFAULT_BRANCH: running the full checks."
              fi
              base="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)" ||
                decide true "No merge base with $DEFAULT_BRANCH: running the full checks."
              ;;
            *) decide true "Unrecognised event $EVENT: running the full checks." ;;
          esac

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            decide true "Base commit unavailable: running the full checks."
          fi

          files="$(git diff --name-only "$base" HEAD)" ||
            decide true "Could not list changed files: running the full checks."
          echo "Changed files since $base:"
          echo "${files:-<none>}"

          if printf '%s\n' "$files" | grep -Eq "$pattern"; then
            decide true "Python-relevant files changed: running the full checks."
          fi
          decide false "No Python-relevant files changed: skipping the Python checks."

  quality:
    name: quality (Python ${{ matrix.python-version }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (pyproject requires-python) through the newest release.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test with coverage
        run: uv run pytest

      # The project itself is not on PyPI, so skip it rather than log a skip notice.
      - name: Audit dependencies
        run: uv run pip-audit --skip-editable

  # The single check that main requires. It always reports, so a skipped matrix
  # (which GitHub names unexpanded) can never leave a required check pending.
  ci:
    name: ci
    needs: [changes, quality]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the Python checks to pass or be skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
        run: |
          echo "changes: $CHANGES, quality: $QUALITY"
          [ "$CHANGES" = success ]
          [ "$QUALITY" = success ] || [ "$QUALITY" = skipped ]
